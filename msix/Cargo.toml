[package]
name = "msix"
version = "0.4.0"
edition = "2021"
description = "Library for creating and signing msix packages."
repository = "https://github.com/rust-mobile/xbuild"
license = "Apache-2.0 OR MIT"

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
byteorder = "1.5.0"
mime_guess = "2.0.5"
quick-xml = { version = "0.41.0", features = ["serialize"] }
rasn = "0.28.13"
rasn-cms = "0.28.13"
rasn-pkix = "0.28.13"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
xcommon = { version = "0.3.0", path = "../xcommon" }
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
der-parser = "8.2.0"
rsa = "0.9.10"
