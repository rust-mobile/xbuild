      # The current version of the Information Property List structure.
      cf_bundle_info_dictionary_version: example,
      # A user-visible short name for the bundle.
      cf_bundle_name: example,
      # The type of bundle.
      cf_bundle_package_type: example,
      # The release or version number of the bundle.
      cf_bundle_short_version_string: example,
      # A replacement for the app name in text-to-speech operations.
      cf_bundle_spoken_name: example,
      # CFBundleSupportedPlatforms
      cf_bundle_supported_platforms: [platform1, platform2],
      # The version of the build that identifies an iteration of the bundle.
      cf_bundle_version: example,
      # the DTCompiler property
      dt_compiler: example,
      # the DTPlatformBuild property
      dt_platform_build: example,
      # the DTPlatformName property
      dt_platform_name: example,
      # the DTPlatformVersion property
      dt_platform_version: example,
      # the DTSDKBuild property
      dt_sdk_build: example,
      # the DTSDKName property
      dt_sdk_name: example,
      # the DTXcode property
      dt_xcode: example,
      # the DTXcodeBuild property
      dt_xcode_build: example,
      #  The category that best describes your app for the App Store.
      ls_application_category_type: examples,
      # The minimum version of the operating system required for the app to run in macOS.
      ls_minimum_system_version: example,
      # A boolean value indicating whether the app must run in iOS.
      ls_requires_ios: false,
      # The minimum version of the operating system required for the app to run in iOS, iPadOS, tvOS, and watchOS.
      minimum_os_version: example,
      # A message that tells the user why the app is requesting access to the device's camera.
      ns_camera_usage_description: 'this is an example',
      # A human-readable copyright notice for the bundle.
      ns_human_readable_copyright: example copyright,
      # the UIDeviceFamilyproperty
      ui_device_family: [1,2,3,4],
      # the UILaunchScreenproperty
      ui_launch_screen: {
        # the UIColorName property
        ui_color_name: example,
        # the UIImageName property
        ui_image_name: example,
        #the UIImageRespectsSafeAreaInsets property
        ui_image_respects_safe_area_insets: false,
        #the UINavigationBar property
        ui_navigation_bar: false,
        # the UITabBar property
        ui_tab_bar: false,
        # the UIToolbar property
        ui_toolbar: false,
      },
      # the UILaunchStoryboardName property
      ui_launch_storyboard_name: example,
      # the UIRequiredDeviceCapabilities property
      ui_required_device_capabilities: [example1, example2,],
      # the UISupportedInterfaceOrientationsproperty~ipad property
      ui_supported_interface_orientations_ipad: [example1, example2],
      # the UISupportedInterfaceOrientations~iphone property
      ui_supported_interface_orientations_iphone: [example1, example2],
