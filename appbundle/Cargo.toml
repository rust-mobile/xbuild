[package]
name = "appbundle"
version = "0.3.0"
edition = "2021"
description = "Library for creating and signing appbundles."
repository = "https://github.com/rust-mobile/xbuild"
license = "Apache-2.0 OR MIT"

[dependencies]
anyhow = "1.0.103"
app-store-connect = "0.7.0"
apple-codesign = "0.29.0"
icns = "0.3.1"
log = "0.4.33"
pkcs8 = { version = "0.10.2", features = ["alloc"] }
plist = "1.9.0"
rasn = "0.28.13"
rasn-cms = "0.28.13"
serde = { version = "1.0.228", features = ["derive"] }
x509-certificate = "0.24.0"
xcommon = { version = "0.3.0", path = "../xcommon" }
